name: callguard-wp07
services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: callguard
      POSTGRES_USER: callguard
      POSTGRES_PASSWORD: ${CALLGUARD_DB_PASSWORD:?set password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callguard -d callguard"]
      interval: 3s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  audit-data:
